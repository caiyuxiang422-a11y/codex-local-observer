name: Bug report
description: Report a reproducible problem without private project data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not post vulnerabilities, credentials, prompts, private source code,
        or personal paths here. Use the private process in SECURITY.md.
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Describe the visible behavior and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS and hardware
      placeholder: macOS 15.x, Apple silicon, built-in display with camera area
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use a disposable project if possible and redact all paths.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Paste only redacted, bounded output.

